<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Écran Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="./">◉ <span>Écran Live</span></a><span class="secure">PARTAGE PRIVÉ</span></header>
    <section class="hero">
      <div class="eyebrow">PARTAGE EN DIRECT</div>
      <h1>Ton écran,<br><em>en direct.</em></h1>
      <p class="intro">Partage ton écran et le son de ton PC. Ta copine regarde depuis son Mac, dans son navigateur.</p>
      <div id="home" class="cards">
        <button id="hostButton" class="card primary"><span class="icon">↗</span><strong>Je partage</strong><small>Démarrer le partage sur ce PC</small><span class="arrow">→</span></button>
        <form id="watchForm" class="card secondary"><label for="roomInput"><span class="icon">▷</span><strong>Je regarde</strong></label><small>Entre le code reçu</small><div class="join"><input id="roomInput" placeholder="Code de partage" maxlength="8" autocomplete="off"><button aria-label="Rejoindre">→</button></div></form>
      </div>
    </section>
    <section id="session" class="session hidden">
      <div class="sessionbar"><span id="status"><i></i> En attente</span><button id="stopButton" class="stop">Arrêter</button></div>
      <div id="shareInfo" class="shareinfo hidden"><div><small>CODE DE PARTAGE</small><strong id="roomCode"></strong></div><button id="copyButton">Copier le lien</button></div>
      <div class="stage"><video id="video" autoplay playsinline controls></video><div id="placeholder" class="placeholder"><span>◉</span><p>Le flux apparaîtra ici</p></div></div>
      <p id="hint" class="hint"></p>
    </section>
    <footer>Utilise Chrome ou Edge pour partager l’écran avec le son du PC.</footer>
  </main>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
